# Fly.io config — AlphaDesk, always-on (never sleeps).
#
#   fly launch --no-deploy --copy-config   # first time (rename the app)
#   fly deploy
#
# See DEPLOY.md. Approx cost for the machine below: ~US$3/month.
app = "alphadesk"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  ALPHADESK_LIVE = "1"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
